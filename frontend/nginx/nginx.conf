worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    # Paths graváveis pelo usuário nginx; não é necessário executar como root.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout safe;

    # DNS interno do Compose; resolve novamente após recriar o backend.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    upstream application_api {
        zone application_api 64k;
        server backend:8080 resolve;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        location = /api {
            include /etc/nginx/api-proxy.conf;
        }
        location ^~ /api/ {
            include /etc/nginx/api-proxy.conf;
        }

        location ~ /\. {
            return 404;
        }
        location = /index.html {
            add_header Cache-Control 'no-store' always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }
        location /assets/ {
            try_files $uri =404;
        }
        # Arquivos ausentes nunca recebem o HTML da aplicação com status 200.
        location ~ /[^/]+\.[^/]+$ {
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
