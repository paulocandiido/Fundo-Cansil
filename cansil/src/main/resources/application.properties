spring.application.name=fundo-cansil
spring.profiles.active=dev

# O Liquibase passa a ser o responsavel pela criacao e evolucao do banco.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# O Hibernate apenas confere se as entidades correspondem ao banco.
spring.jpa.hibernate.ddl-auto=validate

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:4200,http://127.0.0.1:5173}
