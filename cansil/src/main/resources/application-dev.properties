#conexao ao postgresql
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cursodb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# gera log
logging.file.name=${LOG_FILE:${java.io.tmpdir}/fundo-cansil.log}
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

#exibe os SQL gerado no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

cotacao.brapi.base-url=${BRAPI_BASE_URL:https://brapi.dev}
cotacao.brapi.token=${BRAPI_TOKEN}
cotacao.alphavantage.base-url=${ALPHAVANTAGE_BASE_URL:https://www.alphavantage.co}
cotacao.alphavantage.enabled=${ALPHAVANTAGE_ENABLED:false}
cotacao.alphavantage.token=${ALPHAVANTAGE_TOKEN:}
cotacao.hgfinance.base-url=${HGFINANCE_BASE_URL:https://api.hgbrasil.com}
cotacao.hgfinance.enabled=${HGFINANCE_ENABLED:false}
cotacao.hgfinance.token=${HGFINANCE_TOKEN:}
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
