#habilitando o banco de dados h2
spring.h2.console.enabled=true
#path para acesso
spring.h2.console.path=/h2-console

#configuracao acesso ao banco --> jdbc:h2:file:~/cursodb
spring.datasource.url=jdbc:h2:mem:cursodb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# application.properties
logging.file.name=cansil_test.log
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

#exibe os SQL gerado no console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
cotacao.brapi.base-url=http://localhost
cotacao.brapi.token=fake-brapi-test
cotacao.alphavantage.base-url=http://localhost
cotacao.alphavantage.token=fake-alpha-test
cotacao.alphavantage.enabled=true
cotacao.hgfinance.base-url=http://localhost
cotacao.hgfinance.token=fake-hg-test
cotacao.hgfinance.enabled=true
jwt.secret=chave-de-teste-com-no-minimo-trinta-e-dois-bytes
jwt.expiration-seconds=3600
